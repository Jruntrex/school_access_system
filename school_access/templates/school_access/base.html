<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}School Access{% endblock %}</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen flex flex-col">

  <header class="bg-slate-900 text-white">
    <div class="max-w-6xl mx-auto px-4 flex items-center justify-between h-14">
      <a href="{% url 'school_access:dashboard' %}" class="font-bold text-lg tracking-tight">School Access</a>
      <nav class="flex items-center gap-1 text-sm">
        <a href="{% url 'school_access:dashboard' %}"
           class="px-3 py-1.5 rounded {% if active_page == 'dashboard' %}bg-slate-700{% else %}hover:bg-slate-800{% endif %}">
          Дашборд
        </a>
        <a href="{% url 'school_access:card_assignment' %}"
           class="px-3 py-1.5 rounded {% if active_page == 'cards' %}bg-slate-700{% else %}hover:bg-slate-800{% endif %}">
          RFID картки
        </a>
        <a href="{% url 'school_access:meal_report' %}"
           class="px-3 py-1.5 rounded {% if active_page == 'meal_report' %}bg-slate-700{% else %}hover:bg-slate-800{% endif %}">
          Харчовий звіт
        </a>
        <a href="/admin/" class="px-3 py-1.5 rounded hover:bg-slate-800">Адмінка</a>
        <span class="w-px h-5 bg-slate-700 mx-1"></span>
        {% if request.user.is_authenticated %}
          <span class="text-slate-400 px-2">{{ request.user.username }}</span>
          <a href="/admin/logout/" class="px-3 py-1.5 rounded hover:bg-slate-800">Вийти</a>
        {% endif %}
      </nav>
    </div>
  </header>

  <main class="max-w-6xl mx-auto px-4 py-6 flex-1 w-full">
    {% block content %}{% endblock %}
  </main>

</body>
</html>
